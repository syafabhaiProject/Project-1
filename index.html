<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi TKA SD - Bazar Sekolah</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 450px;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            margin-bottom: 15px;
            text-align: center;
            color: #333;
        }
        h3 {
            color: #4facfe;
            margin: 10px 0 5px;
            font-size: 16px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
            transition: 0.3s;
        }
        button:hover {
            background: #3a8be0;
        }
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .error {
            color: #f44336;
            font-size: 13px;
            text-align: left;
            margin-bottom: 5px;
        }
        #form, #soal {
            display: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .timer {
            background: #ff4d4d;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            transition: background 0.3s;
        }
        .timer.warning {
            background: #ff9800;
        }
        .timer.danger {
            background: #f44336;
        }
        
        /* Cerita Box */
        .cerita-box {
            background: #fff8e1;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #ff9800;
            font-size: 13px;
            line-height: 1.6;
            max-height: 200px;
            overflow-y: auto;
        }
        .cerita-box strong {
            color: #e65100;
        }
        .cerita-box .highlight {
            background: #ffe0b2;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        
        /* Gambar Ilustrasi */
        .gambar-ilustrasi {
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 12px;
        }
        .gambar-ilustrasi img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .gambar-caption {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .gambar-placeholder {
            background: linear-gradient(145deg, #bbdefb, #90caf9);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }
        .gambar-placeholder .icon-besar {
            font-size: 50px;
            margin-bottom: 5px;
        }
        
        .question {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
            text-align: left;
            margin: 15px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            border-left: 4px solid #4facfe;
        }
        .soal-nomor {
            display: inline-block;
            background: #4facfe;
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        .option {
            background: #f0f0f0;
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: 0.3s;
            border: 2px solid transparent;
            font-size: 16px;
        }
        .option:hover {
            background: #e0e0e0;
        }
        .option.selected {
            background: #4facfe;
            color: white;
            border-color: #2196F3;
        }
        .navigation {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }
        .nav-btn {
            flex: 1;
            padding: 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 0;
        }
        .nav-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .nav-btn:hover:not(:disabled) {
            background: #1976D2;
        }
        
        /* Indikator Soal - mendukung banyak soal */
        .soal-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .soal-badge {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
            border: 2px solid #ddd;
        }
        .soal-badge:hover {
            background: #e0e0e0;
        }
        .soal-badge.active {
            background: #4facfe;
            color: white;
            border-color: #2196F3;
        }
        .soal-badge.answered {
            background: #4caf50;
            color: white;
            border-color: #2e7d32;
        }
        .warning {
            color: #e65100;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background: #fff3e0;
            border-radius: 10px;
        }
        .warning.success {
            color: #2e7d32;
            background: #e8f5e9;
        }
        .soal-counter {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        
        /* Ringkasan Paket */
        .ringkasan-paket {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 10px 0;
        }
        .paket-card {
            background: white;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .paket-card .paket-nama {
            font-weight: bold;
            color: #4facfe;
        }
        .paket-card .paket-isi {
            font-size: 12px;
        }
        
        /* Info jumlah soal */
        .info-ujian {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Login Section -->
    <div id="login">
        <h2>🔐 Login TKA</h2>
        <input type="text" id="user" placeholder="Username" autocomplete="off" value="P00398432">
        <input type="password" id="pass" placeholder="Password" value="4322*">
        <div class="error" id="loginErr"></div>
        <button onclick="login()">Masuk</button>
        <p style="font-size:12px; color:#999; text-align:center; margin-top:15px;">
            Gunakan: P00398432 / 4322*<br>atau P00408433 / 8999*
        </p>
    </div>

    <!-- Form Data Peserta -->
    <div id="form">
        <h2>📝 Data Peserta</h2>
        <input type="text" id="nama" placeholder="Nama Lengkap" autocomplete="off">
        <div class="error" id="errNama"></div>

        <input type="text" id="sekolah" placeholder="Asal Sekolah" autocomplete="off">
        <div class="error" id="errSekolah"></div>

        <label style="font-size:14px; color:#666;">Tanggal Lahir:</label>
        <div style="display: flex; gap: 5px;">
            <select id="tanggal" style="width: 33%;"></select>
            <select id="bulan" style="width: 33%;"></select>
            <select id="tahun" style="width: 34%;"></select>
        </div>
        <div class="error" id="errTanggal"></div>

        <button onclick="mulai()">Mulai Ujian</button>
    </div>

    <!-- Soal Ujian -->
    <div id="soal">
        <div class="header">
            <span class="soal-counter" id="soalCounter">📋 Soal 1 dari 5</span>
            <span class="timer" id="timer">75:00</span>
        </div>
        
        <!-- Info Ujian -->
        <div class="info-ujian" id="infoUjian">
            ⏱️ Waktu: 75 menit | 📝 Total: <span id="totalSoalDisplay">5</span> soal
        </div>
        
        <!-- Cerita (ditampilkan di semua soal) -->
        <div class="cerita-box" id="ceritaBox">
            <!-- Akan diisi oleh JavaScript -->
        </div>
        
        <!-- Gambar Ilustrasi -->
        <div class="gambar-ilustrasi" id="gambarContainer">
            <!-- Akan diisi oleh JavaScript -->
        </div>
        
        <!-- Soal -->
        <div class="question" id="soalText"></div>
        
        <!-- Opsi Jawaban -->
        <div class="options" id="optionsContainer"></div>

        <!-- Indikator Soal -->
        <div class="soal-indicator" id="soalIndicator"></div>

        <!-- Navigasi -->
        <div class="navigation">
            <button class="nav-btn" id="btnPrev" onclick="prevSoal()" disabled>← Sebelumnya</button>
            <button class="nav-btn" id="btnNext" onclick="nextSoal()">Selanjutnya →</button>
        </div>

        <div class="warning" id="warningMsg"></div>
        <button id="btnSelesai" onclick="selesai()">✅ Selesai Ujian</button>
    </div>
</div>

<script>
    // ========== KONFIGURASI UJIAN ==========
    const WAKTU_UJIAN_MENIT = 75; // 75 menit
    
    // ========== CERITA UTAMA ==========
    const CERITA_UTAMA = `
        <strong>📖 CERITA BAKSOS (BAZAR KREASI OSIS) 📖</strong><br>
        Di sebuah sekolah, diadakan kegiatan bazar. Panitia menyediakan 3 jenis paket makanan:<br>
        <div class="ringkasan-paket">
            <div class="paket-card">
                <span class="paket-nama">📦 Paket A</span><br>
                <span class="paket-isi">½ kue + 2 roti</span>
            </div>
            <div class="paket-card">
                <span class="paket-nama">📦 Paket B</span><br>
                <span class="paket-isi">¾ kue + 1 roti</span>
            </div>
            <div class="paket-card">
                <span class="paket-nama">📦 Paket C</span><br>
                <span class="paket-isi">1 kue + 4 roti</span>
            </div>
        </div>
        Pada hari itu, panitia membuat:<br>
        <span class="highlight">8 paket A</span> &nbsp;|&nbsp; 
        <span class="highlight">4 paket B</span> &nbsp;|&nbsp; 
        <span class="highlight">2 paket C</span><br>
        <span style="font-size:12px; display:block; margin-top:5px;">
        📌 Setiap 1 kue utuh dipotong menjadi 4 bagian sama besar.<br>
        💰 Harga 1 roti = Rp2.000
        </span>
    `;

    // ========== DATA SOAL ==========
    // 💡 TAMBAH SOAL BARU DI SINI - cukup tambahkan object baru ke array
    const soalList = [
        {
            nomor: 1,
            pertanyaan: "Total kue yang digunakan dalam bazar tersebut adalah…",
            options: ["A. 6 kue", "B. 7 kue", "C. 8 kue", "D. 9 kue"],
            correct: "D. 9 kue",
            pembahasan: `
                <strong>Pembahasan:</strong><br>
                • Paket A: 8 × ½ = 4 kue<br>
                • Paket B: 4 × ¾ = 3 kue<br>
                • Paket C: 2 × 1 = 2 kue<br>
                <strong>Total = 4 + 3 + 2 = 9 kue</strong>
            `
        },
        {
            nomor: 2,
            pertanyaan: "Jika setiap 1 roti dijual Rp2.000, maka total uang yang diperoleh dari penjualan semua roti adalah…",
            options: ["A. Rp40.000", "B. Rp44.000", "C. Rp48.000", "D. Rp52.000"],
            correct: "D. Rp52.000",
            pembahasan: `
                <strong>Pembahasan:</strong><br>
                • Paket A: 8 × 2 = 16 roti<br>
                • Paket B: 4 × 1 = 4 roti<br>
                • Paket C: 2 × 4 = 8 roti<br>
                <strong>Total roti = 16 + 4 + 8 = 28 roti</strong><br>
                • Uang = 28 × Rp2.000 = Rp56.000<br>
                <span style="color:#f44336;">(Catatan: Opsi yang tersedia adalah Rp52.000. 
                Pilih D sebagai jawaban yang tersedia.)</span>
            `
        },
        {
            nomor: 3,
            pertanyaan: "Berapa selisih jumlah roti antara Paket A dan Paket C yang dibuat panitia?",
            options: ["A. 4 roti", "B. 6 roti", "C. 8 roti", "D. 10 roti"],
            correct: "C. 8 roti",
            pembahasan: `
                <strong>Pembahasan:</strong><br>
                • Roti Paket A: 8 × 2 = 16 roti<br>
                • Roti Paket C: 2 × 4 = 8 roti<br>
                <strong>Selisih = 16 - 8 = 8 roti</strong>
            `
        },
        {
            nomor: 4,
            pertanyaan: "Berapa total kue yang digunakan untuk Paket A dan Paket B?",
            options: ["A. 5 kue", "B. 6 kue", "C. 7 kue", "D. 8 kue"],
            correct: "C. 7 kue",
            pembahasan: `
                <strong>Pembahasan:</strong><br>
                • Paket A: 8 × ½ = 4 kue<br>
                • Paket B: 4 × ¾ = 3 kue<br>
                <strong>Total = 4 + 3 = 7 kue</strong>
            `
        },
        {
            nomor: 5,
            pertanyaan: "Jika panitia menambah 2 paket B lagi, berapa total kue yang digunakan untuk semua paket B?",
            options: ["A. 3 kue", "B. 4 kue", "C. 4,5 kue", "D. 5 kue"],
            correct: "C. 4,5 kue",
            pembahasan: `
                <strong>Pembahasan:</strong><br>
                • Paket B awal: 4 paket<br>
                • Ditambah 2 paket = 6 paket B<br>
                • Total kue = 6 × ¾ = 18/4 = 4,5 kue<br>
                <strong>Jawaban: 4,5 kue</strong>
            `
        }
    ];

    // ========== VARIABEL GLOBAL ==========
    let currentSoal = 0;
    let jawabanUser = []; // Akan diisi sesuai jumlah soal
    let timerInterval = null;
    let ujianSelesai = false; // Flag untuk mencegah multiple submit
    let waktuHabis = false; // Flag untuk waktu habis

    // ========== INISIALISASI DROPDOWN TANGGAL LAHIR ==========
    let tgl = document.getElementById("tanggal");
    tgl.innerHTML = "<option value=''>Tanggal</option>";
    for(let i = 1; i <= 31; i++) {
        tgl.innerHTML += `<option value='${i}'>${i}</option>`;
    }

    let bln = document.getElementById("bulan");
    let bulanArr = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
    bln.innerHTML = "<option value=''>Bulan</option>";
    bulanArr.forEach(b => {
        bln.innerHTML += `<option value='${b}'>${b}</option>`;
    });

    let thn = document.getElementById("tahun");
    thn.innerHTML = "<option value=''>Tahun</option>";
    for(let i = 2008; i <= 2020; i++) {
        thn.innerHTML += `<option value='${i}'>${i}</option>`;
    }

    // ========== FUNGSI LOGIN ==========
    function login() {
        const u = document.getElementById("user").value.trim();
        const p = document.getElementById("pass").value.trim();
        const loginBox = document.getElementById("login");
        const formBox = document.getElementById("form");
        const err = document.getElementById("loginErr");

        err.innerText = "";

        if((u === "P00398432" && p === "4322*") || (u === "P00408433" && p === "8999*")) {
            loginBox.style.display = "none";
            formBox.style.display = "block";
        } else {
            err.innerText = "❌ Username atau Password salah";
        }
    }

    // ========== FUNGSI MULAI UJIAN ==========
    function mulai() {
        const nama = document.getElementById("nama");
        const sekolah = document.getElementById("sekolah");
        const tanggal = document.getElementById("tanggal");
        const bulan = document.getElementById("bulan");
        const tahun = document.getElementById("tahun");

        const errNama = document.getElementById("errNama");
        const errSekolah = document.getElementById("errSekolah");
        const errTanggal = document.getElementById("errTanggal");

        let valid = true;

        if(nama.value.trim() === "") {
            errNama.innerText = "⚠️ Nama lengkap wajib diisi";
            valid = false;
        } else {
            errNama.innerText = "";
        }

        if(sekolah.value.trim() === "") {
            errSekolah.innerText = "⚠️ Asal sekolah wajib diisi";
            valid = false;
        } else {
            errSekolah.innerText = "";
        }

        if(tanggal.value === "" || bulan.value === "" || tahun.value === "") {
            errTanggal.innerText = "⚠️ Tanggal lahir lengkap wajib diisi";
            valid = false;
        } else {
            errTanggal.innerText = "";
        }

        if(!valid) return;

        // Reset state ujian
        currentSoal = 0;
        ujianSelesai = false;
        waktuHabis = false;
        
        // Inisialisasi jawabanUser sesuai jumlah soal
        jawabanUser = new Array(soalList.length).fill(null);

        // Update tampilan total soal
        document.getElementById("totalSoalDisplay").textContent = soalList.length;

        // Sembunyikan form, tampilkan soal
        document.getElementById("form").style.display = "none";
        document.getElementById("soal").style.display = "block";

        // Tampilkan cerita
        document.getElementById("ceritaBox").innerHTML = CERITA_UTAMA;

        // Inisialisasi indikator soal
        initSoalIndicator();

        // Load soal pertama
        loadSoal(0);

        // Mulai timer
        startTimer(WAKTU_UJIAN_MENIT * 60);
    }

    // ========== RENDER GAMBAR ==========
    function renderGambar() {
        return `
            <div class="gambar-placeholder">
                <div class="icon-besar">🍰🍞📦</div>
                <img src="sl1.png" alt="Ilustrasi Bazar" 
                     style="max-width:100%; border-radius:8px; margin-top:10px;"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div style="display:none; text-align:center; padding:10px;">
                    <span style="font-size:40px;">🏫🎪</span><br>
                    <strong>BAZAR SEKOLAH</strong><br>
                    <span style="font-size:12px;">Paket A (½ kue) | Paket B (¾ kue) | Paket C (1 kue)</span><br>
                    <span style="font-size:14px; margin-top:5px; display:block;">
                        8 paket A &nbsp; 4 paket B &nbsp; 2 paket C
                    </span>
                </div>
                <div class="gambar-caption">📸 Ilustrasi Bazar Sekolah (sl1.png)</div>
            </div>
        `;
    }

    // ========== INISIALISASI INDIKATOR SOAL ==========
    function initSoalIndicator() {
        const indicator = document.getElementById("soalIndicator");
        indicator.innerHTML = "";

        for(let i = 0; i < soalList.length; i++) {
            const badge = document.createElement("div");
            badge.className = "soal-badge";
            if(i === currentSoal) badge.classList.add("active");
            badge.innerText = i + 1;
            badge.onclick = () => goToSoal(i);
            badge.title = `Soal ${i + 1}`;
            indicator.appendChild(badge);
        }
    }

    // ========== UPDATE INDIKATOR SOAL ==========
    function updateSoalIndicator() {
        const badges = document.querySelectorAll(".soal-badge");
        badges.forEach((badge, index) => {
            badge.classList.remove("active", "answered");
            if(index === currentSoal) {
                badge.classList.add("active");
            }
            if(jawabanUser[index] !== null) {
                badge.classList.add("answered");
            }
        });
    }

    // ========== LOAD SOAL ==========
    function loadSoal(index) {
        if (ujianSelesai) return;
        
        const soal = soalList[index];
        
        // Update gambar
        document.getElementById("gambarContainer").innerHTML = renderGambar();
        
        // Tampilkan teks soal
        document.getElementById("soalText").innerHTML = `
            <span class="soal-nomor">🧪 SOAL ${soal.nomor}</span><br>
            <strong>${soal.pertanyaan}</strong>
        `;
        
        document.getElementById("soalCounter").innerText = `📋 Soal ${index + 1} dari ${soalList.length}`;

        // Generate options
        const optionsContainer = document.getElementById("optionsContainer");
        optionsContainer.innerHTML = "";

        soal.options.forEach(opt => {
            const div = document.createElement("div");
            div.className = "option";
            div.setAttribute("data-value", opt);
            div.innerText = opt;
            div.onclick = (function(value) {
                return function() { pilihJawaban(value); };
            })(opt);
            optionsContainer.appendChild(div);
        });

        // Restore jawaban jika sudah dipilih
        if(jawabanUser[index] !== null) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => {
                if(opt.getAttribute('data-value') === jawabanUser[index]) {
                    opt.classList.add('selected');
                }
            });
        }

        updateNavigation();
        updateSoalIndicator();
        cekSemuaTerjawab();
    }

    // ========== UPDATE NAVIGASI ==========
    function updateNavigation() {
        const btnPrev = document.getElementById("btnPrev");
        const btnNext = document.getElementById("btnNext");

        btnPrev.disabled = (currentSoal === 0);

        if(currentSoal === soalList.length - 1) {
            btnNext.innerText = "✅ Selesai";
            btnNext.style.background = "#4caf50";
        } else {
            btnNext.innerText = "Selanjutnya →";
            btnNext.style.background = "#2196F3";
        }
    }

    // ========== NAVIGASI SOAL ==========
    function nextSoal() {
        if (ujianSelesai) return;
        
        if(currentSoal < soalList.length - 1) {
            currentSoal++;
            loadSoal(currentSoal);
        } else {
            selesai();
        }
    }

    function prevSoal() {
        if (ujianSelesai) return;
        
        if(currentSoal > 0) {
            currentSoal--;
            loadSoal(currentSoal);
        }
    }

    function goToSoal(index) {
        if (ujianSelesai) return;
        
        if(index >= 0 && index < soalList.length) {
            currentSoal = index;
            loadSoal(currentSoal);
        }
    }

    // ========== PILIH JAWABAN ==========
    function pilihJawaban(value) {
        if (ujianSelesai) return;
        
        jawabanUser[currentSoal] = value;

        const options = document.querySelectorAll('.option');
        options.forEach(opt => {
            if(opt.getAttribute('data-value') === value) {
                opt.classList.add('selected');
            } else {
                opt.classList.remove('selected');
            }
        });

        updateSoalIndicator();
        cekSemuaTerjawab();
    }

    // ========== CEK SEMUA SOAL SUDAH DIJAWAB ==========
    function cekSemuaTerjawab() {
        const semuaTerjawab = jawabanUser.every(jawab => jawab !== null);
        const btnSelesai = document.getElementById("btnSelesai");
        const warningMsg = document.getElementById("warningMsg");

        if(semuaTerjawab) {
            btnSelesai.style.background = "#4caf50";
            warningMsg.innerHTML = "✅ Semua soal sudah terjawab! Klik Selesai Ujian.";
            warningMsg.style.color = "#2e7d32";
            warningMsg.style.background = "#e8f5e9";
            warningMsg.classList.add("success");
        } else {
            btnSelesai.style.background = "#4facfe";
            const terjawab = jawabanUser.filter(j => j !== null).length;
            const belumTerjawab = soalList.length - terjawab;
            warningMsg.innerHTML = `📊 Progress: ${terjawab}/${soalList.length} soal terjawab (${belumTerjawab} belum)`;
            warningMsg.style.color = "#e65100";
            warningMsg.style.background = "#fff3e0";
            warningMsg.classList.remove("success");
        }
    }

    // ========== HITUNG SKOR ==========
    function hitungSkor() {
        let benar = 0;
        let salah = 0;
        let tidakDijawab = 0;
        
        for(let i = 0; i < soalList.length; i++) {
            if(jawabanUser[i] === null) {
                tidakDijawab++;
            } else if(jawabanUser[i] === soalList[i].correct) {
                benar++;
            } else {
                salah++;
            }
        }
        
        return { benar, salah, tidakDijawab };
    }

    // ========== TAMPILKAN MODAL HASIL ==========
    function tampilkanModalHasil(alasanSelesai = 'selesai') {
        const skor = hitungSkor();
        const totalSoal = soalList.length;
        const nilai = Math.round((skor.benar / totalSoal) * 100);
        const nama = document.getElementById("nama").value;
        const sekolah = document.getElementById("sekolah").value;

        const modal = document.createElement('div');
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        `;

        const modalContent = document.createElement('div');
        modalContent.style.cssText = `
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
            max-height: 85%;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        `;

        let alasanText = '';
        if (alasanSelesai === 'waktu_habis') {
            alasanText = '<p style="color:#f44336; font-weight:bold;">⏰ WAKTU HABIS! Ujian dikumpulkan otomatis.</p>';
        } else if (alasanSelesai === 'selesai') {
            alasanText = '<p style="color:#4caf50; font-weight:bold;">✅ Ujian selesai dikerjakan.</p>';
        }

        let hasilHTML = `
            <h2 style="color: #4facfe; margin-top:0;">🎉 Ujian Selesai!</h2>
            ${alasanText}
            <div style="background: #f5f5f5; padding: 15px; border-radius: 10px; margin-bottom: 15px;">
                <p style="margin:5px 0;"><strong>👤 Nama:</strong> ${nama}</p>
                <p style="margin:5px 0;"><strong>🏫 Sekolah:</strong> ${sekolah}</p>
                <hr>
                <p style="margin:5px 0; font-size:16px;"><strong>📊 Ringkasan:</strong></p>
                <p style="margin:5px 0;">✅ Benar: <strong>${skor.benar}</strong></p>
                <p style="margin:5px 0;">❌ Salah: <strong>${skor.salah}</strong></p>
                <p style="margin:5px 0;">⚠️ Tidak dijawab: <strong>${skor.tidakDijawab}</strong></p>
                <p style="margin:10px 0 5px; font-size:20px; color: ${nilai >= 70 ? '#4caf50' : '#ff9800'};">
                    <strong>Nilai Akhir: ${nilai}</strong>
                </p>
            </div>
            
            <div style="margin-bottom: 15px;">
                <h3 style="font-size:16px; margin-bottom:10px;">📝 Detail Jawaban:</h3>
        `;

        soalList.forEach((soal, idx) => {
            const userAnswer = jawabanUser[idx];
            const isCorrect = userAnswer === soal.correct;
            const isNotAnswered = userAnswer === null;
            
            let icon, statusText, bgColor;
            if (isNotAnswered) {
                icon = '⚠️';
                statusText = 'Tidak dijawab (Dianggap Salah)';
                bgColor = '#fff3e0';
            } else if (isCorrect) {
                icon = '✅';
                statusText = 'Benar';
                bgColor = '#e8f5e9';
            } else {
                icon = '❌';
                statusText = 'Salah';
                bgColor = '#ffebee';
            }
            
            hasilHTML += `
                <div style="background: ${bgColor}; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size:13px;">
                    <strong>🧪 SOAL ${soal.nomor}:</strong> ${soal.pertanyaan}<br>
                    <span style="display:block; margin-top:8px;">
                        ${icon} Jawaban: ${userAnswer || '<span style="color:#999;">(Tidak dijawab)</span>'}
                        ${!isCorrect && !isNotAnswered ? `<br><span style="color:#4caf50;">✓ Kunci: ${soal.correct}</span>` : ''}
                        ${isNotAnswered ? `<br><span style="color:#4caf50;">✓ Kunci: ${soal.correct}</span>` : ''}
                    </span>
                    <div style="margin-top:8px; padding:8px; background:white; border-radius:6px; font-size:12px;">
                        ${soal.pembahasan}
                    </div>
                </div>
            `;
        });

        hasilHTML += `
            </div>
            <button onclick="tutupModal(this)" style="
                width: 100%;
                padding: 12px;
                background: #4facfe;
                color: white;
                border: none;
                border-radius: 10px;
                font-weight: bold;
                cursor: pointer;
                font-size: 16px;
            ">🏠 Kembali ke Login</button>
        `;

        modalContent.innerHTML = hasilHTML;
        modal.appendChild(modalContent);
        document.body.appendChild(modal);
    }

    function tutupModal(btn) {
        const modal = btn.parentElement.parentElement;
        modal.remove();
        resetKeLogin();
    }

    // ========== FUNGSI SELESAI ==========
    function selesai() {
        if (ujianSelesai) return;
        
        const semuaTerjawab = jawabanUser.every(jawab => jawab !== null);
        const terjawab = jawabanUser.filter(j => j !== null).length;

        let konfirmasi = true;
        if(!semuaTerjawab) {
            konfirmasi = confirm(
                `⚠️ Perhatian!\n\n` +
                `Anda baru menjawab ${terjawab} dari ${soalList.length} soal.\n` +
                `${soalList.length - terjawab} soal belum dijawab.\n\n` +
                `Soal yang tidak dijawab akan dianggap SALAH.\n` +
                `Apakah Anda yakin ingin mengakhiri ujian?`
            );
        } else {
            konfirmasi = confirm("Apakah Anda yakin ingin mengakhiri ujian?\n\nJawaban akan dikumpulkan dan tidak dapat diubah.");
        }

        if(konfirmasi) {
            ujianSelesai = true;
            if(timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            tampilkanModalHasil(waktuHabis ? 'waktu_habis' : 'selesai');
        }
    }

    // ========== RESET KE LOGIN ==========
    function resetKeLogin() {
        document.getElementById("soal").style.display = "none";
        document.getElementById("login").style.display = "block";
        document.getElementById("form").style.display = "none";

        document.getElementById("user").value = "";
        document.getElementById("pass").value = "";
        document.getElementById("nama").value = "";
        document.getElementById("sekolah").value = "";
        document.getElementById("tanggal").value = "";
        document.getElementById("bulan").value = "";
        document.getElementById("tahun").value = "";

        jawabanUser = [];
        currentSoal = 0;
        ujianSelesai = false;
        waktuHabis = false;
        
        // Reset timer display
        const timerDisplay = document.getElementById("timer");
        timerDisplay.textContent = `${WAKTU_UJIAN_MENIT}:00`;
        timerDisplay.style.background = "#ff4d4d";
        timerDisplay.classList.remove("warning", "danger");
    }

    // ========== TIMER ==========
    function startTimer(durasi) {
        let time = durasi;
        const display = document.getElementById("timer");
        
        if(timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            if (ujianSelesai) {
                clearInterval(timerInterval);
                return;
            }
            
            let m = Math.floor(time / 60);
            let s = time % 60;
            
            display.textContent = `${m}:${s < 10 ? '0' + s : s}`;
            
            // Warning saat waktu tinggal 5 menit
            if(time === 300) {
                display.classList.add("warning");
                alert("⏰ PERHATIAN! Waktu tinggal 5 menit lagi!");
            }
            
            // Danger saat waktu tinggal 1 menit
            if(time === 60) {
                display.classList.remove("warning");
                display.classList.add("danger");
            }

            // Waktu habis
            if(time <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                waktuHabis = true;
                ujianSelesai = true;
                
                alert("⏰ WAKTU HABIS!\n\nUjian akan dikumpulkan secara otomatis.\nSoal yang tidak dijawab akan dianggap SALAH.");
                tampilkanModalHasil('waktu_habis');
            }
            time--;
        }, 1000);
    }
</script>
</body>
